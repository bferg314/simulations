<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎐</text></svg>">
    <title>Phase Chimes | Simulation Hub</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05070c;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            z-index: 100;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        #hud {
            position: fixed;
            left: 20px;
            bottom: 20px;
            max-width: min(420px, calc(100vw - 40px));
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.85rem;
            line-height: 1.45;
            z-index: 90;
            pointer-events: none;
        }

        #hud .cycle {
            font-variant-numeric: tabular-nums;
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.9);
        }

        #hud .note {
            margin-top: 4px;
            color: rgba(255, 214, 150, 0.85);
        }

        #release {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.9);
            pointer-events: none;
            z-index: 50;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
            transition: opacity 0.6s;
        }

        #release .title {
            font-size: 1.6rem;
            letter-spacing: 0.04em;
            padding: 12px 28px;
            border-radius: 30px;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
        }

        #release .sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        #release.gone {
            opacity: 0;
        }

        @media (max-width: 700px) {
            /* Clear of the back button */
            .tp-dfwv {
                top: 64px !important;
            }

            #hud {
                bottom: 64px;
                font-size: 0.78rem;
            }
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "../../vendor/three/three.module.js",
                "three/addons/": "../../vendor/three/addons/",
                "tweakpane": "../../vendor/tweakpane/tweakpane.min.js"
            }
        }
    </script>
</head>

<body>
    <a href="../../index.html" class="back-btn">← Back to Hub</a>
    <div id="canvas-container"></div>
    <div id="release">
        <div class="title">Click to release</div>
        <div class="sub">sound on · drag to look around</div>
    </div>
    <div id="hud"></div>
    <script type="module" src="script.js"></script>
</body>

</html>
